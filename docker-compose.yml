version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: history-ai-backend
    ports:
      - "8000:8000"
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_MODEL=llama3
    volumes:
      - ./backend/characters:/app/characters
      - ./backend/chroma_db:/app/chroma_db
    restart: unless-stopped
    depends_on:
      - ollama

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: history-ai-frontend
    ports:
      - "3000:80"
    restart: unless-stopped
    depends_on:
      - backend

  ollama:
    image: ollama/ollama:latest
    container_name: history-ai-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

volumes:
  ollama_data:
